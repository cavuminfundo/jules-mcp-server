[project]
name = "jules-mcp-server"
version = "0.2.0"
description = "Production-grade FastMCP server for Google Jules API"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]
readme = "README.md"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
